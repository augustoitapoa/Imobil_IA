<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imobil_IA · Cédulas Clássicas ($TK$)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Orbitron:wght@800;900&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        /* Estrutura de Pagina A4 */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 10mm 8mm;
            margin: 0 auto 20px auto;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: repeat(2, 94mm);
            grid-template-rows: repeat(6, 43mm);
            gap: 2mm 3mm;
            justify-content: center;
            align-content: center;
            box-sizing: border-box;
            page-break-after: always;
        }

        /* Estrutura da Cédula (94mm x 43mm) */
        .bill-card {
            width: 94mm;
            height: 43mm;
            box-sizing: border-box;
            padding: 2.5mm;
            position: relative;
            outline: 1px dashed #cbd5e1; /* Guia de Corte */
            outline-offset: -0.5mm;
            overflow: hidden;
            user-select: none;
        }

        /* Moldura Externa da Cédula */
        .bill-frame {
            width: 100%;
            height: 100%;
            border: 2.5px solid #000000;
            padding: 1.5px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Moldura Interna Dupla Estilizada */
        .bill-inner-border {
            width: 100%;
            height: 100%;
            border: 1.5px solid #000000;
            box-sizing: border-box;
            position: relative;
            display: grid;
            grid-template-columns: 20mm 1fr 20mm;
            align-items: center;
            padding: 1.5mm;

            /* Padrão de Fundo Efeito Gravura / Guilhochê */
            background-image: repeating-radial-gradient(circle at center, transparent 0, transparent 2px, rgba(0,0,0,0.12) 2.5px, transparent 3px);
            background-size: 6px 6px;
        }

        /* Medalhão Central Oval */
        .center-oval {
            width: 100%;
            height: 100%;
            border: 2px solid #000000;
            border-radius: 50% / 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 0 1.5px #000000;
            background-color: inherit; /* Mantém a cor da cédula */
            position: relative;
            z-index: 2;
        }

        .center-number {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 26pt;
            line-height: 1;
            color: #000000;
            letter-spacing: -1px;
            text-shadow: 0.5px 0.5px 0px #000, -0.5px -0.5px 0px #000;
        }

        .center-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 5pt;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #000000;
            text-transform: uppercase;
            margin-top: 1px;
        }

        /* Colunas Laterais de Caixas */
        .side-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            z-index: 2;
        }

        /* Caixa de Valor Numérico */
        .value-box {
            width: 18mm;
            height: 8.5mm;
            border: 1.5px solid #000000;
            background-color: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 13pt;
            color: #000000;
            box-sizing: border-box;
        }

        /* Rosácea Decorativa Central */
        .rosette {
            width: 10mm;
            height: 10mm;
            border: 1px solid #000000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10pt;
            background-color: inherit;
            box-shadow: inset 0 0 0 1px #000000;
        }

        /* Caixa do Ícone Temático */
        .icon-box {
            width: 18mm;
            height: 8.5mm;
            border: 1.5px solid #000000;
            background-color: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11pt;
            box-sizing: border-box;
        }

        /* ===================================================
           PALETA DE CORES DAS CÉDULAS (INSPIRADAS NO BRL / MONOPOLY)
           =================================================== */
        
        /* 1 $TK - Azul Claro (R$ 2) */
        .bg-tk-1 { background-color: #dbeafe !important; }
        
        /* 5 $TK - Roxo / Violeta (R$ 5) */
        .bg-tk-5 { background-color: #f3e8ff !important; }
        
        /* 10 $TK - Vermelho Salmão (R$ 10) */
        .bg-tk-10 { background-color: #ffe4e6 !important; }
        
        /* 20 $TK - Amarelo Canário (R$ 20 / Referência Monopoly) */
        .bg-tk-20 { background-color: #fef08a !important; }
        
        /* 50 $TK - Laranja Ocre (R$ 50) */
        .bg-tk-50 { background-color: #ffedd5 !important; }
        
        /* 100 $TK - Verde Ciano / Turquesa (R$ 100) */
        .bg-tk-100 { background-color: #cff4fc !important; }
        
        /* 500 $TK - Dourado Prateado (Cédula de Alta Denominação) */
        .bg-tk-500 { background-color: #e2e8f0 !important; }


        /* Regras de Impressão */
/* Força a impressão das cores de fundo e estilos no navegador */
* {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}

/* Regras de Impressão para Centralização e Ajuste A4 */
@media print {
    @page {
        size: A4 portrait;
        margin: 0;
    }
    html, body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 210mm;
        height: 297mm;
    }
    .no-print {
        display: none !important;
    }
    .a4-page {
        box-shadow: none !important;
        margin: 0 auto !important;
        padding: 8mm 6mm !important;
        width: 210mm !important;
        height: 297mm !important;
        box-sizing: border-box !important;
        page-break-after: always;
        page-break-inside: avoid;
    }
}
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Painel de Controlo da Página (Não sai na Impressão) -->
    <div class="no-print max-w-5xl mx-auto mb-8 bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-orbitron font-extrabold text-emerald-400">Imobil_IA · Cédulas Clássicas</h1>
            <p class="text-slate-400 text-sm mt-1">Estilo Gravura Vintage Monopoly em Folhas A4 (12 Cédulas por página)</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <a href="index.html" class="no-print bg-slate-700 hover:bg-slate-600 text-slate-200 hover:text-white font-semibold px-4 py-2 rounded-lg text-sm transition border border-slate-600 flex items-center gap-2">
    ← Voltar ao Menu
</a>
            <select id="sheet-filter" onchange="renderBills()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-semibold focus:outline-none focus:border-emerald-500">
                <option value="all">Kit Misto para Jogo (12 Cédulas)</option>
                <option value="1">Apenas 1 $TK (Azul)</option>
                <option value="5">Apenas 5 $TK (Roxo)</option>
                <option value="10">Apenas 10 $TK (Vermelho)</option>
                <option value="20">Apenas 20 $TK (Amarelo)</option>
                <option value="50">Apenas 50 $TK (Laranja)</option>
                <option value="100">Apenas 100 $TK (Ciano)</option>
                <option value="500">Apenas 500 $TK (Prata)</option>
            </select>
            <button onclick="window.print()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-orbitron font-bold px-6 py-2 rounded-lg text-sm transition shadow-lg shadow-emerald-500/20">
                🖨️ Imprimir Cédulas
            </button>
        </div>
    </div>

    <!-- Contentor das Folhas A4 -->
    <div id="pages-container"></div>

    <script>
        const denominations = [
            { value: 1, colorClass: 'bg-tk-1', leftIcon: '⚡', rightIcon: '💻' },
            { value: 5, colorClass: 'bg-tk-5', leftIcon: '🔋', rightIcon: '🤖' },
            { value: 10, colorClass: 'bg-tk-10', leftIcon: '📡', rightIcon: '🌐' },
            { value: 20, colorClass: 'bg-tk-20', leftIcon: '⚙️', rightIcon: '🔒' },
            { value: 50, colorClass: 'bg-tk-50', leftIcon: '🛸', rightIcon: '🛰️' },
            { value: 100, colorClass: 'bg-tk-100', leftIcon: '🖥️', rightIcon: '🏢' },
            { value: 500, colorClass: 'bg-tk-500', leftIcon: '💎', rightIcon: '👑' }
        ];

        function createClassicBillHTML(item) {
            return `
                <div class="bill-card ${item.colorClass}">
                    <div class="bill-frame">
                        <div class="bill-inner-border">
                            
                            <!-- Coluna Esquerda -->
                            <div class="side-col">
                                <div class="value-box">${item.value}</div>
                                <div class="rosette">💮</div>
                                <div class="icon-box">${item.leftIcon}</div>
                            </div>

                            <!-- Oval Central -->
                            <div class="center-oval">
                                <div class="center-number">${item.value}</div>
                                <div class="center-label">TOKENS $TK$</div>
                            </div>

                            <!-- Coluna Direita -->
                            <div class="side-col">
                                <div class="icon-box">${item.rightIcon}</div>
                                <div class="rosette">🔯</div>
                                <div class="value-box">${item.value}</div>
                            </div>

                        </div>
                    </div>
                </div>
            `;
        }

        function renderBills() {
            const container = document.getElementById('pages-container');
            container.innerHTML = '';
            const filterValue = document.getElementById('sheet-filter').value;

            let billsToRender = [];

            if (filterValue === 'all') {
                // Distribuição equilibrada para kit de jogo
                const distribution = [1, 1, 5, 5, 10, 10, 20, 20, 50, 50, 100, 500];
                distribution.forEach(val => {
                    billsToRender.push(denominations.find(d => d.value === val));
                });
            } else {
                // 12 cédulas do mesmo valor selecionado
                const target = denominations.find(d => d.value == filterValue);
                for (let i = 0; i < 12; i++) {
                    billsToRender.push(target);
                }
            }

            const pageDiv = document.createElement('div');
            pageDiv.className = 'a4-page';

            billsToRender.forEach(item => {
                pageDiv.innerHTML += createClassicBillHTML(item);
            });

            container.appendChild(pageDiv);
        }

        // Renderização Inicial
        renderBills();
    </script>
       <footer class="no-print mt-12 text-center text-xs text-slate-500 border-t border-slate-800 pt-6">
        <p>Imobil_IA · Open-source criado por Augusto Itapoã, utilização para fins educativos e não-comerciais</p>
    </footer>
</body>

</html>
