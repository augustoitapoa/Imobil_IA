    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Dimensões Exatas para Impressão A4 e Cartas 60mm x 90mm */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 10mm 8mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: repeat(3, 60mm);
            grid-template-rows: repeat(3, 90mm);
            gap: 4mm 5mm;
            justify-content: center;
            align-content: center;
            box-sizing: border-box;
            page-break-after: always;
        }

        .card {
            width: 60mm;
            height: 90mm;
            border-radius: 4mm;
            box-sizing: border-box;
            padding: 2.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            color: #0f172a;
            border: 1.5mm solid #0f172a;
        }

        /* Estilos específicos de Avanços (Verde) */
        .card-avancos {
            border-color: #10b981;
        }
        .card-avancos .card-header {
            background-color: #10b981;
            color: #ffffff;
        }
        .card-avancos .vocesabia-box {
            background-color: #ecfdf5;
            border-color: #a7f3d0;
            color: #065f46;
        }
        .card-avancos .effect-box {
            background-color: #f0fdf4;
            border-color: #86efac;
            color: #166534;
        }

        /* Estilos específicos de Limites (Vermelho) */
        .card-limites {
            border-color: #ef4444;
        }
        .card-limites .card-header {
            background-color: #ef4444;
            color: #ffffff;
        }
        .card-limites .vocesabia-box {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        .card-limites .effect-box {
            background-color: #fef2f2;
            border-color: #fca5a5;
            color: #991b1b;
        }
* {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}

/* Regras de Impressão para Centralização e Ajuste A4 */
@media print {
    @page {
        size: A4 portrait;
        margin: 0;
    }
    html, body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 210mm;
        height: 297mm;
    }
    .no-print {
        display: none !important;
    }
    .a4-page {
        box-shadow: none !important;
        margin: 0 auto !important;
        padding: 8mm 6mm !important;
        width: 210mm !important;
        height: 297mm !important;
        box-sizing: border-box !important;
        page-break-after: always;
        page-break-inside: avoid;
    }
}

        let showEmojis = true;

        // Inicializador do Grid de Emojis do Teclado
        function initEmojiPicker() {
            const grid = document.getElementById('emoji-grid');
            grid.innerHTML = '';
            emojiList.forEach(emoji => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'hover:bg-slate-800 p-1 rounded transition text-center flex items-center justify-center';
                btn.innerText = emoji;
                btn.onclick = () => selectEmoji(emoji);
                grid.appendChild(btn);
            });
        }

        function toggleEmojiPicker(e) {
            e.stopPropagation();
            const popover = document.getElementById('emoji-picker-popover');
            popover.classList.toggle('hidden');
        }

        function closeEmojiPicker() {
            document.getElementById('emoji-picker-popover').classList.add('hidden');
        }

        function selectEmoji(emoji) {
            document.getElementById('input-emoji').value = emoji;
            closeEmojiPicker();
        }

        // Fechar o popover ao clicar fora dele
        document.addEventListener('click', (e) => {
            const popover = document.getElementById('emoji-picker-popover');
            if (popover && !popover.contains(e.target)) {
                popover.classList.add('hidden');
            }
        });

        function renderCards() {
            const container = document.getElementById('pages-container');
            container.innerHTML = '';

            const cardsPerPage = 9;
            const totalPages = Math.ceil(cardsData.length / cardsPerPage);

            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                const pageCards = cardsData.slice(p * cardsPerPage, (p + 1) * cardsPerPage);

                pageCards.forEach(card => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = `card card-${card.type}`;

                    cardDiv.innerHTML = `
                        <!-- Cabecalho da Carta -->
                        <div class="card-header font-orbitron text-[10px] font-bold uppercase tracking-wider py-1 px-2 text-center rounded-sm flex items-center justify-between">
                            <span>${card.headerText}</span>
                            <span class="text-[9px] opacity-80">Imobil_IA</span>
                        </div>

                        <!-- Elemento Visual / Emoji Icon (Opcional) -->
                        ${showEmojis ? `
                            <div class="emoji-container text-center my-0.5">
                                <span class="text-2xl inline-block drop-shadow-sm">${card.emoji}</span>
                            </div>
                        ` : ''}

                        <!-- Titulo e Descrição Contextual -->
                        <div class="my-0.5 text-center">
                            <h3 class="font-orbitron font-bold text-[10.5px] leading-tight text-slate-900 mb-0.5">${card.title}</h3>
                            <p class="text-[9px] leading-snug text-slate-700 font-medium px-1">${card.description}</p>
                        </div>

                        <!-- Efeito / Dinâmica de Jogo -->
                        ${card.effect ? `
                            <div class="effect-box my-0.5 px-1.5 py-1 text-center border rounded text-[9px] font-extrabold leading-tight">
                                ${card.effect}
                            </div>
                        ` : ''}

                        <!-- Caixa VOCÊ SABIA? -->
                        <div class="vocesabia-box p-1.5 rounded-md border flex-1 flex flex-col justify-between my-0.5">
                            <div>
                                <div class="font-orbitron font-extrabold text-[8px] uppercase tracking-wider mb-0.5 flex items-center gap-1">
                                    <span>💡</span> VOCÊ SABIA?
                                </div>
                                <p class="text-[8px] leading-tight italic font-normal">${card.fact}</p>
                            </div>
                            <div class="text-[7px] text-right opacity-75 font-semibold mt-0.5">
                                Fonte: ${card.source}
                            </div>
                        </div>
                    `;

                    pageDiv.appendChild(cardDiv);
                });

                container.appendChild(pageDiv);
            }
        }

        function addNewCard() {
            const type = document.getElementById('input-type').value;
            const title = document.getElementById('input-title').value.trim();
            const emoji = document.getElementById('input-emoji').value.trim() || '❓';
            const description = document.getElementById('input-description').value.trim();
            const effect = document.getElementById('input-effect').value.trim();
            const fact = document.getElementById('input-fact').value.trim();
            const source = document.getElementById('input-source').value.trim();

            if (!title || !description || !effect || !fact || !source) {
                alert('Por favor, preencha todos os campos obrigatórios para criar a carta.');
                return;
            }

            const newCard = {
                type: type,
                headerText: type === 'avancos' ? 'AVANÇO' : 'LIMITE',
                emoji: emoji,
                title: title,
                description: description,
                effect: effect,
                fact: fact,
                source: source
            };

            cardsData.push(newCard);

            document.getElementById('add-card-form').reset();
            document.getElementById('input-emoji').value = '⚡';

            renderCards();

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function toggleEmojis() {
            showEmojis = !showEmojis;
            const btn = document.getElementById('btn-emoji');
            btn.innerText = showEmojis ? 'Ocultar Emojis' : 'Mostrar Emojis';
            btn.classList.toggle('bg-indigo-600');
            btn.classList.toggle('bg-slate-600');
            renderCards();
        }

        // Execuções Iniciais
        initEmojiPicker();
        renderCards();
    </script>

    </footer>
